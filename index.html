<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>Seller Business Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;z-index:20;background:#111827;color:white;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.brand b{display:block}.brand small{color:#cbd5e1;font-size:11px}
button,.select,input{font:inherit}.btn{border:0;border-radius:9px;padding:9px 12px;background:#fff;color:#111827;font-weight:700}
main{max-width:1200px;margin:auto;padding:14px 14px 90px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar h2{margin:0;font-size:20px}.filters{display:flex;gap:7px;flex-wrap:wrap}
input,.select{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:9px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{background:white;border-radius:12px;padding:13px;box-shadow:0 1px 3px #0001}.card span{font-size:11px;color:#6b7280}.card strong{display:block;font-size:19px;margin-top:5px}
.notice{margin:12px 0;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:11px;font-size:12px;line-height:1.5}
.panel{background:white;border-radius:12px;box-shadow:0 1px 3px #0001;margin-top:12px;padding:12px}.panel h3{margin:0 0 9px;font-size:15px}
.tablewrap{overflow:auto;border-radius:9px}table{width:100%;border-collapse:collapse;min-width:760px;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e7eb;white-space:nowrap}th{background:#f9fafb}
nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;overflow:auto}
nav button{flex:1;min-width:80px;border:0;background:none;padding:11px 4px;font-size:11px;color:#6b7280}nav button.active{font-weight:800;color:#111827}
.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#eef2ff}.muted{color:#6b7280}.danger{color:#991b1b;background:#fee2e2;border:0;border-radius:8px;padding:8px}
@media(min-width:760px){.cards{grid-template-columns:repeat(4,1fr)}main{padding-left:25px;padding-right:25px}nav{top:58px;bottom:auto;right:auto;width:155px;height:calc(100vh - 58px);display:block;border-top:0;border-right:1px solid #ddd}nav button{display:block;width:100%;text-align:left;padding:13px 16px}main{margin-left:155px}}
</style>
</head>
<body>
<header><div class="brand"><b>Seller Business Manager</b><small>Flipkart-first • Mobile Web App</small></div>
<label class="btn">＋ Upload CSV/XLS/XLSX<input id="file" type="file" accept=".csv,.xls,.xlsx" multiple hidden></label></header>
<main id="app"></main>
<nav id="nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
<script>
const state={tab:'Dashboard',orders:[],sales:[],returns:[],settlements:[],customers:[],uploads:[],expenses:[]};
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n)||0);
const norm=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'');
const val=(r,names)=>{let k=Object.keys(r).find(k=>names.map(norm).includes(norm(k)));return k?r[k]:''};
const num=v=>Number(String(v??'').replace(/[₹,\s]/g,''))||0;
const save=()=>localStorage.setItem('seller_manager_v3',JSON.stringify(state));
const load=()=>{try{Object.assign(state,JSON.parse(localStorage.getItem('seller_manager_v3')||'{}'))}catch{}};

function classify(name,sheet){
 const s=(name+' '+sheet).toLowerCase();
 if(s.includes('settlement')) return 'Settlement';
 if(s.includes('return')) return 'Returns';
 if(s.includes('sales')) return 'Sales';
 if(s.includes('p&l')||s.includes('pnl')) return 'P&L';
 if(s.includes('pickup')) return 'Pickup';
 if(s.includes('dbd')) return 'DBD';
 if(s.includes('gstr')||s.includes('gst')) return 'GST';
 if(s.includes('cash back')) return 'Cash Back';
 return 'Orders';
}
function mapOrder(r){
 return {orderId:val(r,['Order ID','order_id']),itemId:val(r,['Order Item ID','order_item_id']),
 product:val(r,['Product Title/Description','Product Title','product_title','Product','SKU']),
 sku:val(r,['SKU','sku']),status:val(r,['Order Item Status','Status','order_item_status']),
 date:val(r,['Order Date','Ordered On','order_date']),qty:num(val(r,['Quantity','Qty','units'])),
 amount:num(val(r,['Final Invoice Amount','Invoice Amount','Selling Price','Order Item Value'])),
 buyer:val(r,['Buyer Name','Ship to Name','Customer Name']),city:val(r,['City']),
 state:val(r,['State','Delivery State']),pin:val(r,['PIN Code','Pincode','Postal Code'])};
}
async function readFile(file){
 const ext=file.name.split('.').pop().toLowerCase(); let sheets=[];
 if(ext==='csv'){let t=await file.text();sheets=[{name:'CSV',rows:Papa.parse(t,{header:true,skipEmptyLines:true}).data}]}
 else {let b=await file.arrayBuffer(),wb=XLSX.read(b,{type:'array'});sheets=wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''})}))}
 let added=0;
 for(const sh of sheets){
   const type=classify(file.name,sh.name);
   for(const r of sh.rows){
     const o=mapOrder(r);
     if(type==='Returns') state.returns.push({...r,__type:type,__sheet:sh.name});
     else if(type==='Settlement') state.settlements.push({...r,__type:type,__sheet:sh.name});
     else if(type==='Sales') state.sales.push({...r,__type:type,__sheet:sh.name});
     else if(o.orderId||o.itemId||o.product){state.orders.push({...o,__type:type,__sheet:sh.name});added++}
   }
 }
 state.uploads.unshift({file:file.name,time:new Date().toLocaleString(),added});
 save(); render();
}
document.getElementById('file').onchange=e=>Promise.all([...e.target.files].map(readFile)).then(()=>alert('Import complete. Check Dashboard / Orders / Customers / Reports.'));
function customers(){
 const m=new Map();
 for(const o of state.orders){
   const key=[o.buyer,o.city,o.state,o.pin].map(x=>String(x||'').toLowerCase().trim()).join('|');
   const x=m.get(key)||{name:o.buyer||'Unknown',city:o.city||'',state:o.state||'',pin:o.pin||'',orders:0,qty:0,purchase:0};
   x.orders++;x.qty+=o.qty;x.purchase+=o.amount;m.set(key,x);
 } return [...m.values()].sort((a,b)=>b.purchase-a.purchase);
}
function dashboard(){
 const orders=state.orders.length, sales=state.orders.reduce((a,x)=>a+x.amount,0);
 return `<div class="toolbar"><h2>Dashboard</h2><div class="filters"><select class="select" id="range"><option>Last 7 Days</option><option selected>Last 30 Days</option><option>Last 90 Days</option><option>All Time</option></select><span class="badge">Flipkart</span></div></div>
 <div class="cards">${[['Orders',orders],['Sales',money(sales)],['Returns',state.returns.length],['Settlement Rows',state.settlements.length],['Customers',customers().length],['Sales Rows',state.sales.length],['Uploads',state.uploads.length],['Bank', 'Not connected']].map(x=>`<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div>
 <div class="notice"><b>Important:</b> Bank statement is optional. Until actual Settlement-to-Bank matching and product-cost data are mapped, the app will not label a number as final “net profit”.</div>
 <div class="panel"><h3>Core reconciliation flow</h3><div>Order → Sales Event → Marketplace Settlement → Bank Credit (optional) → Expenses/Product Cost → Actual Profit</div></div>`;
}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('')}</tbody></table>${!rows.length?'<div class="panel muted">No data yet.</div>':''}</div>`}
function render(){
 const nav=['Dashboard','Orders','Customers','Returns','Settlements','Expenses','Reports','Uploads'];
 document.getElementById('nav').innerHTML=nav.map(x=>`<button class="${state.tab===x?'active':''}" data-tab="${x}">${x}</button>`).join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
 let c='';
 if(state.tab==='Dashboard')c=dashboard();
 if(state.tab==='Orders')c=`<div class="toolbar"><h2>Orders (${state.orders.length})</h2></div>${table(['Order ID','Item ID','Product','Customer','Date','Qty','Amount','Status'],state.orders.slice().reverse().map(o=>[o.orderId,o.itemId,o.product,o.buyer,o.date,o.qty,money(o.amount),o.status]))}`;
 if(state.tab==='Customers')c=`<h2>Customers (${customers().length})</h2><div class="panel">${table(['Customer','City','State','PIN','Orders','Qty','Total Purchase'],customers().map(x=>[x.name,x.city,x.state,x.pin,x.orders,x.qty,money(x.purchase)]))}</div>`;
 if(state.tab==='Returns')c=`<h2>Returns (${state.returns.length})</h2><div class="panel">${table(['Order Item ID','Return ID','Requested','Status','Reason','Result'],state.returns.map(r=>[val(r,['order_item_id','Order Item ID']),val(r,['return_id','Return ID']),val(r,['return_requested_date','Return Date']),val(r,['return_status','Status']),val(r,['return_reason','Reason']),val(r,['return_result','Result'])]))}</div>`;
 if(state.tab==='Settlements')c=`<h2>Settlements (${state.settlements.length})</h2><div class="notice">Settlement files have multiple sections. They are stored separately so fees, taxes, adjustments and order payments can be reconciled without double counting.</div>`;
 if(state.tab==='Expenses')c=`<h2>Expenses</h2><div class="notice">Add later: Product Purchase • Packaging • Shipping • Ads • Marketplace • Salary • Electricity • Rent • Other.</div>`;
 if(state.tab==='Reports')c=`<h2>Reports</h2><div class="panel"><b>Available data</b><p>Orders: ${state.orders.length} • Sales rows: ${state.sales.length} • Returns: ${state.returns.length} • Settlement rows: ${state.settlements.length}</p><p>Next calculation layer: exact Flipkart settlement reconciliation + return/RTO adjustments + product cost.</p></div>`;
 if(state.tab==='Uploads')c=`<h2>Upload History</h2><div class="panel">${table(['File','Rows Added','Imported'],state.uploads.map(x=>[x.file,x.added,x.time]))}<button class="danger" id="clear">Clear local app data</button></div>`;
 document.getElementById('app').innerHTML=c;
 document.getElementById('clear')?.addEventListener('click',()=>{if(confirm('Clear all imported local data?')){localStorage.removeItem('seller_manager_v3');location.reload()}});
}
load();render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
